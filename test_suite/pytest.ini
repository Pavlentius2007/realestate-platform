[tool:pytest]
# Основные настройки
testpaths = test_suite
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    --maxfail=5
    --cov=backend
    --cov-report=html:test_suite/reports/coverage
    --cov-report=term-missing
    --cov-report=xml:test_suite/reports/coverage.xml
    --junitxml=test_suite/reports/junit.xml
    --html=test_suite/reports/report.html
    --self-contained-html

# Маркеры
markers =
    unit: Unit тесты
    integration: Интеграционные тесты
    e2e: End-to-end тесты
    security: Тесты безопасности
    performance: Performance тесты
    slow: Медленные тесты
    smoke: Дымовые тесты
    regression: Регрессионные тесты

# Фильтры
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Настройки покрытия
[coverage:run]
source = backend
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */migrations/*
    */alembic/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# Настройки для разных окружений
[testenv]
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-html>=3.2.0
    pytest-xdist>=3.3.0
    pytest-mock>=3.11.0
    pytest-asyncio>=0.21.0
    httpx>=0.25.0
    selenium>=4.15.0
    locust>=2.17.0 